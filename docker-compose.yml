services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb local/weather-etl --ignore-existing;
      mc mb local/airflow-logs --ignore-existing;
      echo 'MinIO bucket weather-etl is ready';
      "

  mongodb:
    image: mongo:7
    ports:
      # Use 27018 on the host — Windows mongod.exe often occupies 127.0.0.1:27017
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "admin",
          "-p",
          "changeme",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      airflow-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://airflow-logs
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: aws_default
      AIRFLOW__LOGGING__DELETE_LOCAL_LOGS: "true"
      AIRFLOW_UID: 50000
      AIRFLOW_CONN_AWS_DEFAULT: aws://minioadmin:minioadmin@/?endpoint_url=http%3A%2F%2Fminio%3A9000
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: weather-etl
      MINIO_SECURE: "false"
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: weather_etl
      MONGODB_USERNAME: weather_user
      MONGODB_PASSWORD: weather_pass
      MONGODB_AUTH_SOURCE: weather_etl
      PYTHONPATH: /opt/airflow/project
      PYTHONIOENCODING: utf-8
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname Air --lastname Flow --role Admin --email admin@example.com || true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://airflow-logs
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: aws_default
      AIRFLOW__LOGGING__DELETE_LOCAL_LOGS: "true"
      AIRFLOW_CONN_AWS_DEFAULT: aws://minioadmin:minioadmin@/?endpoint_url=http%3A%2F%2Fminio%3A9000
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: weather-etl
      MINIO_SECURE: "false"
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: weather_etl
      MONGODB_USERNAME: weather_user
      MONGODB_PASSWORD: weather_pass
      MONGODB_AUTH_SOURCE: weather_etl
      PYTHONPATH: /opt/airflow/project
      PYTHONIOENCODING: utf-8
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: s3://airflow-logs
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: aws_default
      AIRFLOW__LOGGING__DELETE_LOCAL_LOGS: "true"
      AIRFLOW_CONN_AWS_DEFAULT: aws://minioadmin:minioadmin@/?endpoint_url=http%3A%2F%2Fminio%3A9000
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: weather-etl
      MINIO_SECURE: "false"
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: weather_etl
      MONGODB_USERNAME: weather_user
      MONGODB_PASSWORD: weather_pass
      MONGODB_AUTH_SOURCE: weather_etl
      PYTHONPATH: /opt/airflow/project
      PYTHONIOENCODING: utf-8
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
    restart: unless-stopped

  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: weather_etl
      MONGODB_USERNAME: weather_user
      MONGODB_PASSWORD: weather_pass
      MONGODB_AUTH_SOURCE: weather_etl
      PYTHONPATH: /app
    ports:
      - "8888:8888"
    volumes:
      - ./MachineLearning:/app/MachineLearning

volumes:
  airflow_db_data:
  minio_data:
  mongo_data:

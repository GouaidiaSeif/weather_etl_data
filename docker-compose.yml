services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin 2>/dev/null; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb local/weather-etl --ignore-existing;
      echo 'MinIO bucket weather-etl is ready';
      "

  mongodb:
    image: mongo:7
    ports:
      # Use 27018 on the host — Windows mongod.exe often occupies 127.0.0.1:27017
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "admin",
          "-p",
          "changeme",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build: .
    depends_on:
      minio-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: weather-etl
      MINIO_SECURE: "false"
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: weather_etl
      MONGODB_USERNAME: weather_user
      MONGODB_PASSWORD: weather_pass
      MONGODB_AUTH_SOURCE: weather_etl
      LOG_PATH: /app/data/logs
      PYTHONIOENCODING: utf-8
    command: ["python", "scheduler.py"]
    volumes:
      - etl_logs:/app/data/logs
    restart: unless-stopped

  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: weather_etl
      MONGODB_USERNAME: weather_user
      MONGODB_PASSWORD: weather_pass
      MONGODB_AUTH_SOURCE: weather_etl
      PYTHONPATH: /app
    ports:
      - "8888:8888"
    volumes:
      - ./MachineLearning:/app/MachineLearning

volumes:
  minio_data:
  mongo_data:
  etl_logs:
